services:
  cache22:
    build: .
    image: cache22:local
    container_name: cache22
    restart: unless-stopped
    ports:
      - "8080:10000"
    environment:
      CACHE22_ADDR: ":10000"
      CACHE22_BASE_URL: "http://localhost:8080"
      CACHE22_DATA: "/data/cache22.db"
    volumes:
      - cache22-data:/data
    healthcheck:
      test: ["CMD", "/cache22", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cache22-data:
